[project]
name = "credit-card-fraud"
version = "0.1.0"
description = "Credit-card fraud detection with honest evaluation under extreme class imbalance"
readme = "README.md"
authors = [{ name = "Nipuna Lakruwan" }]
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openml>=0.15.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
